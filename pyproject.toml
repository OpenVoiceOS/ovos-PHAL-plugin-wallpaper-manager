[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos_PHAL_plugin_wallpaper_manager"
dynamic = ["version"]
description = "A plugin for OpenVoiceOS hardware abstraction layer"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Aiix", email = "aix.m@outlook.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: System :: Networking",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "ovos-plugin-manager>=0.0.23,<3.0.0",
    "ovos-utils>=0.0.33,<1.0.0",
    "ovos_bus_client>=0.0.3,<3.0.0",
    "wallpaper-finder",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-PHAL-plugin-wallpaper-manager"

[project.entry-points."opm.phal"]
"ovos-PHAL-plugin-wallpaper-manager" = "ovos_PHAL_plugin_wallpaper_manager:WallpaperManager"

[tool.setuptools.dynamic]
version = {attr = "ovos_PHAL_plugin_wallpaper_manager.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_PHAL_plugin_wallpaper_manager*"]

[tool.setuptools.package-data]
ovos_PHAL_plugin_wallpaper_manager = [
    "*.json",
    "locale/**/*",
    "wallpapers/*",
]
